<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>설교 인쇄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 설교 매니저 글꼴 메뉴와 같은 글꼴 — 빠지면 쪽이 달라진다 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Gowun+Batang:wght@400;700&family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/sermon-doc.css?v=20261023lib1" />
  <style>
    html, body { margin: 0; background: #48413B; font-family: 'Noto Sans KR', sans-serif; }
    #bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 14px; background: #fff; border-bottom: 1px solid #E4DEDA; font-size: 13.5px; }
    #bar button { font: inherit; font-size: 13.5px; padding: 6px 12px; border: 1px solid #D9D1CB; border-radius: 8px; background: #fff; cursor: pointer; }
    #bar button.solid { background: #3A281C; border-color: #3A281C; color: #fff; font-weight: 700; }
    #bar button:disabled { opacity: .5; cursor: default; }
    #st { color: #796A5F; }
    #drive_link { color: #B27343; font-weight: 600; }
    #pages { padding: 24px 12px 60px; }
    @media print { #bar { display: none !important; } #pages { padding: 0 !important; } html, body { background: #fff; } }
  </style>
</head>
<body>
  <div id="bar" class="sdoc-noprint">
    <button type="button" id="b_close">‹ 닫기</button>
    <button type="button" id="b_print" class="solid">인쇄 · PDF로 저장</button>
    <button type="button" id="b_drive">Google Drive에 저장 (교회 PC)</button>
    <a id="drive_link" href="#" target="_blank" rel="noopener" style="display:none"></a>
    <span id="st"></span>
  </div>
  <div id="pages"></div>
  <script src="js/config.js"></script>
  <script src="js/sermon-doc.js?v=20261013a"></script>
  <script src="js/sermon-pdf-job.js?v=20261013a"></script>
  <script src="js/sermon-print.js?v=20261023lib1"></script>
</body>
</html>
