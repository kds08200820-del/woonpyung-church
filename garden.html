<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Garden</title>
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="manifest.json?v=20261023lib1" />
  <meta name="theme-color" content="#F6EFE5" />
  <link rel="icon" href="images/favicon-32.png?v=20260906lib13" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=20260906lib13" />
  <meta name="apple-mobile-web-app-title" content="운평장로교회" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261023lib1" />
  <link rel="stylesheet" href="css/garden.css?v=20261025pr2" />
</head>
<body class="garden" data-church="woonpyung">

  <div class="g-root" id="gRoot" data-mode="loading">
    <!-- 장면(층): scene.js 가 채운다 -->
    <div class="g-scene" id="gScene" aria-hidden="true"></div>

    <!-- 장면 하늘 위 (오른쪽 패널 왼쪽 위): 나의 정원에 들어가기(입체, 2026-10-23 담임목사) + 날씨 -->
    <div class="g-wx-float" id="gTopActs">
      <button type="button" class="g-enter3d" id="gEnter3d" hidden><svg class="g-enter3d-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9L12 3Zm0 0v9m0 0 8-4.5M12 12 4 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-i18n="g3d.enter"></span></button>
      <button type="button" class="g-chip g-chip-wx" id="gWx" hidden aria-haspopup="dialog"><span class="g-chip-ic" id="gWxIc" aria-hidden="true"></span><span id="gWxText"></span></button>
    </div>
    <!-- 장면 왼쪽 위(서재 오른쪽): 화면 돌리기 — 메인 장면의 밭을 90°씩 돌려 본다 (2026-10-23 담임목사). 밭이 있을 때만 보인다 -->
    <button type="button" class="g-rotate" id="gRotate" hidden data-i18n-aria="field.rotate" data-i18n-title="field.rotate"><svg class="g-rotate-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4.5v5h-5M19.6 9.5A8 8 0 1 0 20 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="g-rotate-t" data-i18n="field.rotate"></span></button>

    <!-- 왼쪽 서재(개인) -->
    <aside class="g-study g-panel" id="gStudy" aria-labelledby="gStudyTitle">
      <h2 class="g-ptitle" id="gStudyTitle" data-i18n="study.title"></h2>
      <div class="g-qtcard" id="gQtCard" hidden>
        <span class="g-qt-badge" id="gQtBadge"></span>
        <h3 class="g-qt-title" id="gQtTitle"></h3>
        <p class="g-qt-ref" id="gQtRef"></p>
        <div class="g-qt-actions">
          <button type="button" class="g-btn g-btn-primary" id="gQtOpen" data-i18n="qt.read"></button>
          <button type="button" class="g-btn g-btn-line" id="gQtListen" data-i18n="qt.listen"></button>
        </div>
        <p class="g-qt-done" id="gQtDone" hidden></p>
      </div>
      <p class="g-empty" id="gQtLoading" data-i18n="qt.loading"></p>
      <p class="g-empty" id="gQtEmpty" hidden data-i18n="qt.none"></p>
      <!-- 지금 받는 신청서: 신청 기간에만 큐티 아래에 뜬다 -->
      <section class="g-forms" id="gForms" hidden aria-labelledby="gFormsT"></section>
      <div class="g-study-links">
        <a class="g-link" href="dashboard.html" data-i18n="study.dashboard"></a>
        <a class="g-link" href="audiobook.html" data-i18n="study.audiobook"></a>
      </div>
    </aside>

    <!-- 오른쪽 레일: 달란트·날씨·연속·오늘의 할 일·내 식물 -->
    <aside class="g-rail g-panel" id="gRail" aria-labelledby="gRailTitle">
      <h2 class="g-ptitle g-sr" id="gRailTitle" data-i18n="rail.title"></h2>
      <!-- 내 모습: 장면의 인물을 오른쪽 메뉴 맨 위로, 그 아래에 메뉴 (2026-10-23 담임목사) -->
      <section class="g-me" id="gMe" aria-labelledby="gMeTitle">
        <div class="g-me-pic" id="gMePic" aria-hidden="true"></div>
        <div class="g-me-txt">
          <p class="g-me-lv" id="gMeLv" hidden><b></b><small></small></p>
          <h3 class="g-stitle" id="gMeTitle" data-i18n="me.title"></h3>
          <b class="g-me-name" id="gMeName"></b>
          <button type="button" class="g-link g-profile-btn" id="gProfileBtn" data-i18n="profile.open"></button>
          <button type="button" class="g-link g-guide-btn" id="gGuideBtn" data-i18n="guide.open" hidden></button>
        </div>
      </section>
      <!-- 정원 초대하기 · 이웃 정원 방문 (2026-10-23 담임목사) — 서버 기능이 있을 때만 visit.js 가 보인다 -->
      <div class="g-visit-row" id="gVisitRow" hidden>
        <button type="button" class="g-btn g-btn-line g-visit-b" id="gInviteBtn" aria-haspopup="dialog"><span data-i18n="invite.open"></span><span class="g-vbadge" id="gInviteBadge" hidden></span></button>
        <button type="button" class="g-btn g-btn-line g-visit-b" id="gVisitBtn" aria-haspopup="dialog" data-i18n="visit.open"></button>
      </div>
      <div class="g-chips">
        <button type="button" class="g-pill g-pill-talent" id="gTalentBtn" aria-haspopup="dialog" data-i18n-title="talent.open"><span class="g-pill-ic" aria-hidden="true">🪙</span><b id="gTalentNum">0</b><span class="g-pill-unit" id="gTalentUnit"></span></button>
        <div class="g-chip g-chip-streak" id="gStreak" hidden><span class="g-chip-ic" aria-hidden="true">🔥</span><span id="gStreakText"></span></div>
        <div class="g-chip g-chip-off" id="gOffline" hidden data-i18n="rail.offline"></div>
      </div>
      <section class="g-todo" aria-labelledby="gTodoTitle">
        <h3 class="g-stitle g-fold-h" id="gTodoTitle"><button type="button" class="g-fold" id="gTodoFold" aria-expanded="true" aria-controls="gTodoBody"><span data-i18n="todo.title"></span><span class="g-fold-n" id="gTodoCount" hidden></span><span class="g-fold-ic" aria-hidden="true"></span></button></h3>
        <div id="gTodoBody">
          <ul class="g-todo-list" id="gTodoList"></ul>
          <p class="g-empty" id="gTodoEmpty" hidden data-i18n="todo.empty"></p>
        </div>
      </section>
      <section class="g-growth" aria-labelledby="gGrowTitle">
        <h3 class="g-stitle" id="gGrowTitle" data-i18n="growth.title"></h3>
        <div class="g-grow-row"><span class="g-grow-stage" id="gGrowStage"></span><span class="g-grow-xp" id="gGrowXp"></span></div>
        <div class="g-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="g-bar-fill" id="gGrowFill"></div></div>
        <p class="g-grow-done" id="gGrowDone"></p>
        <p class="g-grow-mine" id="gGrowMine" hidden></p>
        <div class="g-gauges" id="gGrowGauges" hidden></div>
        <div class="g-farm-acts">
          <button type="button" class="g-btn g-btn-primary" id="gWaterBtn" hidden></button>
          <button type="button" class="g-btn g-btn-primary" id="gFruitBtn" hidden></button>
          <button type="button" class="g-btn g-btn-line" id="gFarmBtn" hidden data-i18n="farm.open"></button>
          <button type="button" class="g-btn g-btn-line" id="gShopBtn" hidden data-i18n="shop.open"></button>
          <button type="button" class="g-btn g-btn-line" id="gStorageBtn" hidden aria-haspopup="dialog" data-i18n="storage.open"></button>
        </div>
      </section>
      <!-- 다음 미션: 집 지을 준비 (2026-10-23 담임목사 — 일정 수준의 자산이 모이면) — storage.js 가 채운다 -->
      <section class="g-mission" id="gMission" hidden aria-labelledby="gMissionT">
        <h3 class="g-stitle" id="gMissionT" data-i18n="build.title"></h3>
        <p class="g-mission-m" id="gMissionM"></p>
        <div class="g-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="gMissionT"><div class="g-bar-fill" id="gMissionFill"></div></div>
        <p class="g-mission-p" id="gMissionP"></p>
        <button type="button" class="g-btn g-btn-line" id="gMissionBtn" aria-haspopup="dialog" data-i18n="build.see"></button>
      </section>
      <!-- 갤러리(우리들 소식) 바로 가기 -->
      <a class="g-gallery" href="story.html#album"><span class="g-gallery-t" data-i18n="rail.gallery"></span><span class="g-gallery-go" aria-hidden="true">›</span><span class="g-gallery-s" data-i18n="rail.gallery.sub"></span></a>
    </aside>
    <!-- 오른쪽 메뉴 숨기기/꺼내기 손잡이 (2026-10-23 담임목사: 오른쪽으로 숨기고 다시 빼기) -->
    <button type="button" class="g-rail-tog" id="gRailTog" aria-controls="gRail" aria-expanded="true"><span class="g-rail-tog-ic" aria-hidden="true"></span></button>

    <!-- 예배 띠 -->
    <a class="g-banner" id="gBanner" href="#" role="button" hidden><span class="g-bn-t" id="gBnT"></span><span class="g-bn-c" id="gBnC"></span><span class="g-bn-go" aria-hidden="true">›</span></a>
    <!-- 설교하기: 예배 띠가 뜰 때 관리자에게만 (hud.js syncPreach) -->
    <a class="g-preach" id="gPreach" href="#" target="_blank" rel="noopener" hidden>🎤 설교하기 <small>발표자 모드</small></a>

    <!-- 하단 바 -->
    <nav class="g-bar" id="gBar" data-i18n-aria="bar.label">
      <button type="button" class="g-tab is-on" data-tab="mine"><span class="g-tab-ic" aria-hidden="true">🌱</span><span data-i18n="bar.mine"></span></button>
      <a class="g-tab" href="home.html?home=1"><span class="g-tab-ic" aria-hidden="true">⛪</span><span data-i18n="bar.church"></span></a>
      <button type="button" class="g-tab" data-tab="world"><span class="g-tab-ic" aria-hidden="true">🌍</span><span data-i18n="bar.world"></span></button>
    </nav>

    <!-- 안내판(세션 없음·오류·준비 중·로그인 중) -->
    <div class="g-gate" id="gGate" hidden>
      <div class="g-gate-box" role="region" aria-labelledby="gGateT">
        <div class="g-gate-ic" aria-hidden="true">🌱</div>
        <h2 class="g-gate-t" id="gGateT"></h2>
        <p class="g-gate-m" id="gGateM"></p>
        <div class="g-gate-actions" id="gGateActions"></div>
      </div>
    </div>
  </div>

  <!-- 큐티 팝업 (데스크톱: 캐릭터 오른쪽 말풍선 / 폰: 시트) -->
  <div class="g-modal g-modal-qt" id="gmQt" hidden>
    <div class="g-backdrop" data-close></div>
    <div class="g-mbox g-mbox-qt" role="dialog" aria-modal="true" aria-labelledby="gmQtTitle">
      <span class="g-grab" aria-hidden="true"></span>
      <button type="button" class="g-mclose" data-close data-i18n-aria="common.close">&times;</button>
      <div class="g-mhead">
        <span class="g-qt-badge" id="gmQtBadge"></span>
        <h2 class="g-mtitle" id="gmQtTitle"></h2>
        <p class="g-qt-ref" id="gmQtRef"></p>
      </div>
      <div class="g-mbody g-qt-body" id="gmQtBody"></div>
      <div class="g-amen" id="gmAmen"></div>
    </div>
  </div>

  <!-- 창고 -->
  <div class="g-modal" id="gmStore" hidden>
    <div class="g-backdrop" data-close></div>
    <div class="g-mbox g-mbox-store" role="dialog" aria-modal="true" aria-labelledby="gmStoreTitle">
      <span class="g-grab" aria-hidden="true"></span>
      <button type="button" class="g-mclose" data-close data-i18n-aria="common.close">&times;</button>
      <div class="g-mhead">
        <h2 class="g-mtitle" id="gmStoreTitle" data-i18n="store.title"></h2>
        <p class="g-msub" id="gmStoreSub" data-i18n="store.sub"></p>
        <div class="g-store-bal"><span class="g-pill-ic" aria-hidden="true">🪙</span><b id="gmStoreNum">0</b><span id="gmStoreUnit"></span></div>
      </div>
      <div class="g-wl-top" id="gmWalletTop" hidden></div>
      <ul class="g-led-list" id="gmStoreList"></ul>
      <p class="g-empty" id="gmStoreEmpty" hidden></p>
      <p class="g-led-total" id="gmStoreTotal"></p>
      <div class="g-mfoot"><button type="button" class="g-btn g-btn-line" id="gmStoreMore" hidden data-i18n="store.more"></button></div>
    </div>
  </div>

  <!-- 첫 심기 -->
  <div class="g-modal" id="gmPlant" hidden>
    <div class="g-backdrop" data-close></div>
    <div class="g-mbox g-mbox-plant" role="dialog" aria-modal="true" aria-labelledby="gmPlantTitle">
      <span class="g-grab" aria-hidden="true"></span>
      <button type="button" class="g-mclose" data-close data-i18n-aria="common.close">&times;</button>
      <div class="g-mhead">
        <span class="g-step" id="gObStepNum"></span>
        <h2 class="g-mtitle" id="gmPlantTitle"></h2>
      </div>
      <div class="g-ob-step" id="gObStep1">
        <label class="g-field"><span class="g-flabel" data-i18n="onboard.nick.label"></span><input type="text" id="gObNick" maxlength="20" autocomplete="nickname" data-i18n-ph="onboard.nick.ph" /></label>
        <!-- 내 모습 만들기(avatar.js): 얼굴·눈·눈썹·코·입·귀·머리·몸·옷을 하나하나 (2026-10-25 담임목사) -->
        <div class="g-field"><span class="g-flabel" data-i18n="onboard.avatar.label"></span><p class="g-avx-note" id="gObDraft" hidden data-i18n="avx.draft"></p><div class="g-avx-host" id="gObAvatars"></div></div>
        <div class="g-mfoot"><button type="button" class="g-btn g-btn-primary" id="gObNext" data-i18n="onboard.next"></button></div>
      </div>
      <div class="g-ob-step" id="gObStep2" hidden>
        <div class="g-field"><span class="g-flabel" data-i18n="onboard.seed.label"></span><div class="g-seeds" id="gObSeeds" role="radiogroup"></div></div>
        <label class="g-field"><span class="g-flabel" data-i18n="onboard.name.label"></span><input type="text" id="gObName" maxlength="12" data-i18n-ph="onboard.name.ph" /></label>
        <div class="g-mfoot g-mfoot-2">
          <button type="button" class="g-btn g-btn-line" id="gObBack" data-i18n="onboard.back"></button>
          <button type="button" class="g-btn g-btn-primary" id="gObPlant" data-i18n="onboard.plant"></button>
        </div>
      </div>
      <p class="g-ferr" id="gObErr" hidden></p>
    </div>
  </div>

  <!-- 스토어(꽃집) -->
  <div class="g-modal g-modal-shop" id="gmShop" hidden>
    <div class="g-backdrop" data-close></div>
    <div class="g-mbox g-mbox-shop" role="dialog" aria-modal="true" aria-labelledby="gmShopTitle">
      <span class="g-grab" aria-hidden="true"></span>
      <button type="button" class="g-mclose" data-close data-i18n-aria="common.close">&times;</button>
      <div class="g-mhead">
        <h2 class="g-mtitle" id="gmShopTitle" data-i18n="shop.title"></h2>
        <p class="g-msub" data-i18n="shop.sub"></p>
        <div class="gf-stats"><span class="g-chip gf-bal"><b id="gsBal">0</b><span data-i18n="talent.unit"></span></span><span class="g-chip gs-bag" id="gsBag"></span></div>
        <div class="gs-tabs" id="gsTabs" role="tablist"></div>
      </div>
      <div class="gs-list" id="gsList"></div>
    </div>
  </div>

  <!-- 나의 보관함: 내 자산 · 다음 미션 · 건축 자재 · 심지 않은 씨앗·묘목 · 배운 교육 · 다녀온 여행 · 지은 집 (2026-10-23 담임목사) -->
  <div class="g-modal" id="gmStorage" hidden>
    <div class="g-backdrop" data-close></div>
    <div class="g-mbox g-mbox-store g-mbox-storage" role="dialog" aria-modal="true" aria-labelledby="gmStorageTitle">
      <span class="g-grab" aria-hidden="true"></span>
      <button type="button" class="g-mclose" data-close data-i18n-aria="common.close">&times;</button>
      <div class="g-mhead">
        <h2 class="g-mtitle" id="gmStorageTitle" data-i18n="storage.title"></h2>
        <p class="g-msub" data-i18n="storage.sub"></p>
      </div>
      <div class="gst-body" id="gstBody"></div>
    </div>
  </div>

  <!-- 안내 도우미 (하루 처음 들어올 때 · 내 모습 칸의 '오늘의 안내') -->
  <div class="g-modal" id="gmGuide" hidden>
    <div class="g-backdrop" data-close></div>
    <div class="g-mbox g-mbox-guide" role="dialog" aria-modal="true" aria-labelledby="gmGuideTitle">
      <span class="g-grab" aria-hidden="true"></span>
      <button type="button" class="g-mclose" data-close data-i18n-aria="common.close">&times;</button>
      <div class="gd-head">
        <div class="gd-pic" id="gdPic" aria-hidden="true"></div>
        <div class="gd-say"><h2 class="g-mtitle" id="gmGuideTitle"></h2><p class="gd-lead" id="gdLead"></p></div>
      </div>
      <div class="gd-body" id="gdBody"></div>
      <div class="gd-foot">
        <label class="gd-daily"><input type="checkbox" id="gdDaily" checked> <span data-i18n="guide.daily"></span></label>
        <button type="button" class="g-btn g-btn-primary" data-close data-i18n="guide.go"></button>
      </div>
    </div>
  </div>

  <!-- 주간 날씨 (날씨 칩을 누르면) -->
  <div class="g-modal" id="gmWeather" hidden>
    <div class="g-backdrop" data-close></div>
    <div class="g-mbox g-mbox-weather" role="dialog" aria-modal="true" aria-labelledby="gmWeatherTitle">
      <span class="g-grab" aria-hidden="true"></span>
      <button type="button" class="g-mclose" data-close data-i18n-aria="common.close">&times;</button>
      <div class="g-mhead">
        <h2 class="g-mtitle" id="gmWeatherTitle" data-i18n="wx.week"></h2>
        <p class="g-msub" id="gwPlace"></p>
        <div class="gw-region"><button type="button" class="g-btn g-btn-line" id="gwPick" data-i18n="wx.region.pick"></button><button type="button" class="g-btn g-btn-line" id="gwReset" data-i18n="wx.region.reset" hidden></button></div>
        <p class="g-wl-note" data-i18n="wx.region.note"></p>
      </div>
      <div id="gwBody"></div>
    </div>
  </div>

  <!-- 정원 초대하기 -->
  <div class="g-modal" id="gmInvite" hidden>
    <div class="g-backdrop" data-close></div>
    <div class="g-mbox g-mbox-invite" role="dialog" aria-modal="true" aria-labelledby="gmInviteTitle">
      <span class="g-grab" aria-hidden="true"></span>
      <button type="button" class="g-mclose" data-close data-i18n-aria="common.close">&times;</button>
      <div class="g-mhead">
        <h2 class="g-mtitle" id="gmInviteTitle" data-i18n="invite.title"></h2>
        <p class="g-msub" data-i18n="invite.sub"></p>
      </div>
      <div class="gv-inv-state"><span class="gv-state" id="gvState"></span><button type="button" class="g-btn g-btn-primary" id="gvSwitch" aria-pressed="false"></button></div>
      <div class="gv-share" id="gvShare" hidden>
        <label class="g-sr" for="gvUrl" data-i18n="invite.url"></label>
        <input type="text" id="gvUrl" readonly>
        <div class="gv-share-b"><button type="button" class="g-btn g-btn-line" id="gvCopy" data-i18n="invite.copy"></button><button type="button" class="g-btn g-btn-line" id="gvSend" data-i18n="invite.share"></button></div>
      </div>
      <button type="button" class="g-link gv-preview" id="gvPreview" data-i18n="invite.preview" hidden></button>
      <h3 class="g-stitle gv-myt" data-i18n="nb.title"></h3>
      <div class="gv-nb" id="gvNb"></div>
      <h3 class="g-stitle gv-myt" data-i18n="invite.gb"></h3>
      <ul class="gv-gb" id="gvMyGb"></ul>
      <p class="g-empty" id="gvMyGbNone" hidden data-i18n="invite.gb.none"></p>
    </div>
  </div>

  <!-- 이웃 정원 방문 -->
  <div class="g-modal" id="gmVisit" hidden>
    <div class="g-backdrop" data-close></div>
    <div class="g-mbox g-mbox-visit" role="dialog" aria-modal="true" aria-labelledby="gmVisitTitle">
