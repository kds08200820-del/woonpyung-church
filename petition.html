  <style>
    .pt-wrap{max-width:900px;margin:0 auto;padding:0 18px 60px}
    .pt-card{background:#fff;border:1px solid #EEEDEA;border-radius:2px;padding:18px;margin-bottom:16px}
    .pt-card h3{margin:0 0 10px;font-size:1.05rem}
    .pt-empty{text-align:center;color:#898885;padding:40px 10px}
    .pt-depts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .pt-depts button{border:1px solid #D9D8D5;background:#fff;padding:7px 14px;border-radius:2px;cursor:pointer;font:inherit;font-weight:700}
    .pt-depts button.on{background:#111;color:#fff;border-color:#111}
    .pt-t{width:100%;border-collapse:collapse;font-size:.9rem}
    .pt-t th,.pt-t td{padding:8px 7px;border-bottom:1px solid #F2F1EE;text-align:left}
    .pt-t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .pt-bar{position:relative;height:18px;background:#F2F2F2;border-radius:2px;overflow:hidden;min-width:120px}
    .pt-bar i{position:absolute;left:0;top:0;bottom:0;background:#9E9E9E}
    .pt-bar i.p{background:#E0B4B4}
    .pt-bar.over i{background:#C62828}
    .pt-bar b{position:relative;font-size:.76rem;padding-left:6px;line-height:18px}
    .pt-left{font-size:.8rem;color:#565552;margin-top:3px}
    .pt-left.low{color:#C62828;font-weight:700}
    .pt-f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .pt-f label{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px}
    .pt-f input,.pt-f select,.pt-f textarea{width:100%;padding:9px 10px;border:1px solid #D9D8D5;border-radius:2px;font:inherit;background:#fff;box-sizing:border-box}
    .pt-f .full{grid-column:1/-1}
    .pt-after{grid-column:1/-1;background:#FDFCF9;border-left:3px solid #C62828;padding:9px 12px;font-size:.9rem}
    .pt-rcps{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .pt-rcps div{position:relative;width:90px;height:110px;border:1px solid #E5E4E1;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#898885;overflow:hidden;background:#fafafa}
    .pt-rcps img{max-width:100%;max-height:100%}
    .pt-rcps button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:2px;cursor:pointer;font-size:.75rem}
    .pt-st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:700;background:#F2F2F2;color:#555}
    .pt-st.approved{background:#111;color:#fff}.pt-st.rejected{background:#FBEDEA;color:#A33A2A}.pt-st.cancelled{color:#AAA}
    .pt-msg{font-size:.88rem;margin-top:8px}
    .pt-help{font-size:.84rem;color:#898885;line-height:1.6}
    @media (max-width:640px){.pt-f{grid-template-columns:1fr}.pt-t .hide-m{display:none}}
  </style>
</head>
