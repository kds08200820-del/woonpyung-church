<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>목회 행정 | 운평장로교회</title>
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="manifest.json?v=20261023lib1" />
  <meta name="theme-color" content="#F6EFE5" />
  <link rel="icon" href="images/favicon-32.png?v=20260906lib13" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=20260906lib13" />
  <meta name="apple-mobile-web-app-title" content="운평장로교회" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- 설교 에디터 글꼴 선택용 · 모두 오픈폰트 라이선스(상업적 이용 무료) -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Gowun+Batang:wght@400;700&family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261025vid1" />
  <style>
    /* ── 목회 행정 앱 틀(2026-10-22): 왼쪽 메뉴 + 오른쪽 본문. 머리글(#header)은 늘 흰 바탕(히어로 없음) ── */
    body.af-app{background:#F5F3F2}
    body.af-app #header{transition:none}
    /* ── 테마 맞추기(2026-10-23): 왼쪽 메뉴와 같은 먹색·평평한 모양을 모든 화면·팝업에 ──
       화면·팝업 글자색 대부분이 var(--accent) 를 쓰므로 여기서 남색 → 먹색으로 바꾼다 */
    body.af-app{--accent:#2E2016;--accent-soft:#6B625B}
    body.af-app .btn{border-radius:3px;border-width:1px;letter-spacing:0;transition:background .15s ease,border-color .15s ease,color .15s ease}
    body.af-app .btn-solid{background:#2E2016;border-color:#2E2016;color:#fff}
    body.af-app .btn-solid:hover{background:#403A36;border-color:#403A36;color:#fff}
    body.af-app .btn-line{background:#fff;border-color:#D8D3D0;color:#2E2016}
    body.af-app .btn-line:hover{background:#F7F5F4;border-color:#2E2016}
    body.af-app .btn:disabled{opacity:.55;cursor:default}
    body.af-app .btn:focus-visible{outline:2px solid #2E2016;outline-offset:1px}
    body.af-app .modal-box{border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
    body.af-app .modal-close:hover{color:#2E2016}
    body.af-app .fin-tabs{border-bottom-width:1px}
    body.af-app .fin-tabs button::after{bottom:-1px;height:2px;border-radius:0}
    body.af-app .fin-pill{border-radius:2px}
    body.af-app .fin-table th{color:#7D7167;font-size:.8rem;font-weight:600;background:#FBFAFA}
    body.af-app .auth-card,body.af-app .nav-dropdown-inner{border-radius:6px;border-color:#E9E6E3}
    body.af-app .nav-dropdown-inner a{border-radius:3px}
    body.af-app .ac-admin-go,body.af-app .ac-dash-go{border-radius:3px !important}
    .af-root{padding-top:var(--af-top,66px);min-height:100vh;box-sizing:border-box}
    .af-root>.fin-card,.af-root>p{max-width:560px;margin:48px auto}
    .af-shell{display:flex;align-items:stretch;min-height:calc(100vh - var(--af-top,66px))}
    .af-side{flex:0 0 228px;width:228px;background:#2E2016;color:#CEC8C4;position:sticky;top:var(--af-top,66px);height:calc(100vh - var(--af-top,66px));overflow-y:auto;z-index:20;scrollbar-width:thin;scrollbar-color:#453F39 transparent}
    .af-brand{display:block;padding:22px 20px 18px;border-bottom:1px solid #332E2A;text-decoration:none}
    .af-brand-t{display:flex;align-items:center;gap:7px;font-size:1.32rem;font-weight:800;color:#fff;letter-spacing:-.01em;line-height:1.2}
    .af-brand-t span{background:#B5562F;color:#2E2016;font-size:.86rem;padding:2px 7px 3px;border-radius:3px;font-weight:800;letter-spacing:0}
    .af-brand-s{font-size:.74rem;color:#9A8573;margin-top:6px}
    .af-nav{padding:8px 0 28px}
    .af-grp{font-size:.7rem;color:#7E7267;font-weight:600;padding:16px 20px 6px;letter-spacing:.02em}
    .af-nav button,.af-nav a{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;padding:10px 20px 10px 17px;background:none;border:0;border-left:3px solid transparent;color:#CEC8C4;font:inherit;font-size:.9rem;font-weight:500;text-align:left;cursor:pointer;text-decoration:none;transition:background .15s ease,color .15s ease}
    .af-nav button:hover,.af-nav a:hover{background:#262320;color:#fff}
    .af-nav button:focus-visible,.af-nav a:focus-visible{outline:2px solid #B5562F;outline-offset:-2px}
    .af-nav button.active{background:#302B27;color:#fff;font-weight:700;border-left-color:#B5562F}
    .af-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#fff;color:#2E2016;font-size:.72rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
    .af-badge[hidden]{display:none}
    .af-ext{margin-left:auto;font-size:.75rem;color:#7E7267}
    .af-main{flex:1;min-width:0;padding:26px 30px 70px}
    @media(max-width:900px){
      .af-shell{display:block;min-height:0}
      .af-side{width:auto;height:auto;overflow:visible;z-index:40}
      .af-brand,.af-grp,.af-nav a{display:none}
      .af-nav{display:flex;overflow-x:auto;padding:0;scrollbar-width:none}
      .af-nav::-webkit-scrollbar{display:none}
      .af-nav button{width:auto;flex:none;padding:13px 14px 11px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
      .af-nav button.active{border-bottom-color:#B5562F}
      .af-main{padding:18px 14px 50px}
    }
    .fin-wrap{max-width:1280px}
    .fin-tabs{display:flex;gap:6px;border-bottom:2px solid var(--line,#ECE8E5);margin:8px 0 20px;flex-wrap:wrap}
    .fin-tabs button{position:relative;background:none;border:none;padding:10px 16px;font-weight:700;color:var(--ink-soft,#93867C);cursor:pointer;font-family:inherit;transition:color .2s ease,transform .2s ease}
    .fin-tabs button::after{content:"";position:absolute;left:14px;right:14px;bottom:-2px;height:3px;border-radius:3px;background:var(--accent,#3A281C);transform:scaleX(0);transform-origin:center;transition:transform .28s cubic-bezier(.4,0,.2,1)}
    .fin-tabs button:hover{color:var(--accent,#3A281C);transform:translateY(-1px)}
    .fin-tabs button:hover::after{transform:scaleX(1)}
    .fin-tabs button.active{color:var(--accent,#3A281C)}
    .fin-tabs button.active::after{transform:scaleX(1)}
    .fin-card{background:#fff;border:1px solid #E9E6E3;border-radius:4px;padding:18px;margin-bottom:18px}
    .fin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    .fin-table{width:100%;border-collapse:collapse;font-size:.9rem}
    .fin-table th,.fin-table td{padding:8px 9px;border-bottom:1px solid var(--line,#F4F1EF);text-align:left;vertical-align:top}
    .fin-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;background:#F6F2EF;color:#5D4D40}
    .fin-msg{font-size:.85rem}
    .af-field label{display:block;font-size:.82rem;color:var(--ink-soft,#93867C);margin-bottom:5px}
    .af-field input,.af-field select,.af-field textarea{width:100%;padding:9px 10px;border:1px solid #DDD9D5;border-radius:3px;font:inherit}
    .af-field input:focus,.af-field select:focus,.af-field textarea:focus{outline:none;border-color:#2E2016;box-shadow:0 0 0 2px rgba(46,32,22,.08)}
    .af-field label{color:#6B625B;font-weight:600}
    .af-field textarea{min-height:74px;resize:vertical}
    .fin-sugg{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:#fff;border:1px solid #ECE8E5;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:240px;overflow:auto;z-index:30}
    .fin-sugg div{padding:8px 11px;cursor:pointer;font-size:.88rem;border-bottom:1px solid #F4F0EB}
    .fin-sugg div:last-child{border-bottom:none}
    .fin-sugg div:hover,.fin-sugg div.hi{background:#FBF8F6}
    /* ── 대시보드(2026-10-22): 평평한 흰 카드 · 검은 숫자 · 오른쪽 알림 ── */
    .dsh-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
    .dsh-title{margin:0;font-size:1.35rem;font-weight:800;color:#13110F;letter-spacing:-.01em}
    .dsh-date{font-size:.84rem;color:#95806D;margin-top:4px}
    .dsh-new{background:#13110F;color:#fff;border:0;border-radius:3px;padding:11px 18px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .15s ease}
    .dsh-new:hover{background:#403A36}
    .dsh-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
    .dsh-rail{margin-top:16px}
    .dsh-rail .dsh-panel:first-child{margin-top:0}
    /* 좁으면 한 줄로: 알림은 맨 위, 메모는 맨 아래 */
    @media(max-width:1360px){.dsh-body{grid-template-columns:minmax(0,1fr)}.dsh-rail{display:contents}.dsh-alerts{order:-1}.dsh-memo{order:1}.dsh-rail .dsh-panel.dsh-alerts{margin-top:16px}.dsh-rail .dsh-panel.dsh-memo{margin-top:0}}
    @media(min-width:601px) and (max-width:1360px){.dn{padding:10px 0}.dn-b{display:flex;align-items:center;justify-content:space-between;gap:14px}.dn-b .dn-btn{margin-top:0;white-space:nowrap}}
    .dsh-sec{display:flex;align-items:baseline;gap:8px;font-size:1rem;font-weight:800;color:#13110F;margin:26px 0 10px}
    .dsh-sec small{font-size:.76rem;color:#A3907F;font-weight:500}
    .dsh-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .dk{background:#fff;border:1px solid #E9E6E3;border-radius:3px;padding:14px 16px 13px;min-height:98px;box-sizing:border-box;display:flex;flex-direction:column;transition:border-color .15s ease,box-shadow .15s ease}
    .dk.click{cursor:pointer}
    .dk.click:hover{border-color:#C2BBB6;box-shadow:0 2px 10px rgba(19,17,15,.06)}
    .dk.click:focus-visible{outline:2px solid #13110F;outline-offset:1px}
    .dk.hot{border-left:3px solid #13110F;padding-left:14px}
    .dk-l{font-size:.78rem;color:#7D7167;font-weight:500}
    .dk-n{font-size:1.6rem;font-weight:800;color:#13110F;line-height:1.15;margin-top:8px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
    .dk-s{font-size:.73rem;color:#A3907F;margin-top:5px;line-height:1.45;word-break:keep-all}
    .dsh-panel{background:#fff;border:1px solid #E9E6E3;border-radius:3px;padding:18px 20px;margin-top:16px}
    .dsh-ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .dsh-ph b{font-size:.98rem;color:#13110F;font-weight:800}
    .dsh-ph small{font-size:.76rem;color:#A3907F;font-weight:500;margin-left:6px}
    .dsh-link{background:none;border:0;padding:0;font:inherit;font-size:.8rem;color:#5E544C;cursor:pointer;white-space:nowrap}
    .dsh-link:hover{color:#13110F;text-decoration:underline}
    .dsh-seg{display:inline-flex;border:1px solid #DDD9D5;border-radius:3px;overflow:hidden}
    .dsh-seg button{background:#fff;border:0;padding:5px 12px;font:inherit;font-size:.78rem;color:#5E544C;cursor:pointer}
    .dsh-seg button+button{border-left:1px solid #DDD9D5}
    .dsh-seg button.on{background:#13110F;color:#fff}
    .dsh-tbl{width:100%;border-collapse:collapse;font-size:.86rem;border:1px solid #E9E6E3}
    .dsh-tbl td{padding:10px 12px;border-top:1px solid #F0EEED;vertical-align:middle}
    .dsh-tbl .d{color:#95806D;white-space:nowrap;font-variant-numeric:tabular-nums;width:1%}
    .dsh-tbl .s{white-space:nowrap;width:1%}
    .dsh-tbl .t{color:#13110F;font-weight:500;word-break:keep-all}
    .dsh-tbl .r{color:#7D7167;white-space:nowrap;text-align:right;width:1%}
    .dsh-chip{display:inline-block;padding:2px 8px;border:1px solid #E0DDDA;border-radius:2px;font-size:.74rem;color:#4B443D;background:#FBFAF8}
    .dsh-bar{flex:1;background:#F2F0EF;border-radius:2px;height:14px;overflow:hidden}
    .dsh-bar i{display:block;height:100%;background:#35302C}
    .dsh-notes{border-top:1px solid #F0EEED}
    .dn{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #F0EEED}
    .dn-tag{flex:none;align-self:flex-start;font-size:.7rem;font-weight:700;color:#38332E;border:1px solid #D8D3D0;border-radius:2px;padding:1px 6px;margin-top:2px}
    .dn-b{flex:1;min-width:0;font-size:.85rem;color:#38332E;line-height:1.6;word-break:keep-all}
    .dn-b b{color:#13110F}
    .dn-btn{display:inline-block;margin-top:8px;background:#fff;border:1px solid #D8D3D0;border-radius:2px;padding:7px 12px;font:inherit;font-size:.8rem;font-weight:700;color:#13110F;cursor:pointer}
    .dn-btn:hover{border-color:#13110F}
    .dn-empty{font-size:.84rem;color:#A3907F;padding:14px 0 2px}
    @media(max-width:600px){.dsh-tbl .r,.dsh-tbl .s{display:none}.dsh-tbl td{padding:9px 8px}.dk{min-height:88px;padding:12px 13px}.dk-n{font-size:1.4rem}}
  </style>
</head>
