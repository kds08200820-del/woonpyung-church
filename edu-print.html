<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의실 인쇄 | 운평장로교회</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="images/favicon-32.png?v=20260906lib13" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <!-- 시험지·결과지·학습/세례/입교 교인 증명서 인쇄(PDF 저장) — js/edu-print.js (2026-10-25 담임목사 지시) -->
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#E9E4DE;color:#1F1712;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
    .bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 12px;background:#2E2016;color:#F3E9DE;font-size:14px}
    .bar button,.bar a{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;text-decoration:none}
    .bar .p{background:#B5562F;color:#fff}.bar .s{background:#fff;color:#2E2016}
    .bar span{opacity:.8;font-size:12.5px}
    .page{width:210mm;min-height:297mm;margin:16px auto;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:16mm 15mm;position:relative}
    .msg{max-width:520px;margin:60px auto;background:#fff;border-radius:14px;padding:28px 24px;text-align:center;line-height:1.7}
    .msg h1{font-size:20px;margin:0 0 8px;color:#3A281C}
    @media screen and (max-width:820px){.page{width:auto;min-height:0;margin:10px;padding:18px 14px}}
    /* 시험지 */
    .sh-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #3A281C;padding-bottom:8px;margin-bottom:10px}
    .sh-h .ch{font-size:12px;color:#6E523C;font-weight:700;letter-spacing:.06em}
    .sh-h h1{margin:2px 0 0;font-family:"Noto Serif KR",serif;font-size:22px;color:#2E2016}
    .sh-h .st{text-align:right;font-size:12px;color:#6E523C}
    .sh-h .st b{display:block;font-size:30px;line-height:1.05;color:#B5562F;font-variant-numeric:tabular-nums}
    table.info{width:100%;border-collapse:collapse;font-size:12.5px;margin:0 0 12px}
    table.info td{border:1px solid #CDBFB1;padding:6px 9px}
    table.info td.l{background:#F6EFE5;color:#5A4433;font-weight:700;width:15%;white-space:nowrap}
    .stamp{display:inline-block;padding:1px 10px;border:2px solid currentColor;border-radius:4px;font-weight:900;letter-spacing:.1em}
    .stamp.ok{color:#B5562F}.stamp.no{color:#7D7167}
    .qs{columns:2;column-gap:9mm;font-size:11.4px;line-height:1.5}
    .q{break-inside:avoid;page-break-inside:avoid;margin:0 0 8px;padding:0 0 7px;border-bottom:1px dotted #D8CCBF}
    .q .t{display:flex;gap:5px;font-weight:700;color:#2E2016}
    .q .t .m{flex:0 0 auto;width:16px;font-weight:900;text-align:center}
    .q.o .t .m{color:#2F6B4F}.q.x .t .m{color:#A33A2A}
    .q ol{margin:3px 0 0 21px;padding:0;list-style:none}
    .q ol li{position:relative;padding-left:2px}
    .q ol li.pick{font-weight:700}
    .q ol li.ans::after{content:" ✔ 정답";color:#2F6B4F;font-size:10px;font-weight:700}
    .q ol li.pick.wrong{text-decoration:line-through;color:#A33A2A}
    .q ol li.pick::before{content:"▶";position:absolute;left:-12px;font-size:8.5px;top:2px;color:#3A281C}
    .q .ex{margin:2px 0 0 21px;color:#7D7167;font-size:10.4px}
    .q .nopick{margin:2px 0 0 21px;color:#A33A2A;font-size:10.4px}
    .sh-f{margin-top:12px;font-size:11px;color:#7D7167;border-top:1px solid #D8CCBF;padding-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .sh-f b{color:#3A281C}
    /* 증명서 */
    .cert{padding:12mm}
    .frame{position:relative;height:100%;min-height:258mm;border:2.5px solid #6E523C;padding:4px}
    .frame-in{position:relative;height:100%;min-height:257mm;border:1px solid #B5562F;padding:16mm 15mm 14mm;display:flex;flex-direction:column}
    .frame-in::before,.frame-in::after{content:"";position:absolute;width:26px;height:26px;border:2px solid #B5562F}
    .frame-in::before{top:6px;left:6px;border-right:0;border-bottom:0}
    .frame-in::after{bottom:6px;right:6px;border-left:0;border-top:0}
    .c-no{font-size:13px;color:#3A281C;letter-spacing:.04em}
    .c-title{margin:14mm 0 12mm;text-align:center;font-family:"Noto Serif KR",serif;font-weight:900;font-size:34px;letter-spacing:.42em;color:#2E2016;padding-left:.42em}
    table.c-tb{width:100%;border-collapse:collapse;font-size:15px;margin:0 0 12mm}
    table.c-tb td{padding:9px 6px;border-bottom:1px solid #D8CCBF}
    table.c-tb td.l{width:30%;color:#5A4433;font-weight:700;letter-spacing:.3em;white-space:nowrap}
    table.c-tb td.v{font-family:"Noto Serif KR",serif;font-size:16px}
    .blank{display:inline-block;min-width:150px;border-bottom:1px solid #9B8775;height:1em}
    .c-body{font-family:"Noto Serif KR",serif;font-size:16.5px;line-height:2.1;text-align:center;word-break:keep-all;margin:0 auto;max-width:150mm}
    .c-edu{text-align:center;font-size:12px;color:#7D7167;margin-top:6mm}
    .c-date{text-align:center;font-family:"Noto Serif KR",serif;font-size:17px;margin:auto 0 10mm;padding-top:14mm;letter-spacing:.08em}
    .c-sign{text-align:center;font-family:"Noto Serif KR",serif;line-height:1.9}
    .c-sign .dn{font-size:14px;color:#3A281C}
    .c-sign .ch{font-size:25px;font-weight:900;letter-spacing:.32em;padding-left:.32em;color:#2E2016;margin-top:8px}
    /* 교회 직인: 끝 글자 '회' 의 가운데(0.5em)에서 시작 — 도장 왼쪽 절반이 '회' 의 오른쪽 절반에 걸친다. 곱하기 섞기로 글자가 비쳐 보인다 */
    .c-sign .ch .last{position:relative;display:inline-block}
    .c-sign .ch .last img{position:absolute;left:.5em;top:50%;transform:translateY(-50%);width:70px;height:auto;max-width:none;opacity:.9;mix-blend-mode:multiply;pointer-events:none}
    .c-sign .ps{font-size:17px;letter-spacing:.18em;display:inline-block;white-space:nowrap;margin-top:30px;padding-left:66px}
    /* 당회장 도장: 이름 뒤 '(인)' 칸(58px)에 가운데 맞춰 찍는다. 왼쪽 66px 여백은 (인) 칸만큼 밀린 줄을 되돌려 '담임목사 김 동 석' 이 가운데 오게 한다 */
    .c-sign .in{position:relative;display:inline-block;width:58px;margin-left:8px;text-align:center;letter-spacing:0;font-size:14px;color:#9B8775;vertical-align:middle}
    .c-sign .in img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:auto;max-height:56px;max-width:none;object-fit:contain;opacity:.92;mix-blend-mode:multiply;pointer-events:none}
    .void{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .void span{transform:rotate(-24deg);font-size:64px;font-weight:900;color:rgba(163,58,42,.28);border:8px solid rgba(163,58,42,.28);padding:6px 30px;letter-spacing:.2em}
    /* 인쇄: 쪽 여백은 @page 가 맡는다(두 쪽째도 같은 여백) — 증명서 틀은 한 쪽(297-24mm)을 꽉 채운다 */
    @page{size:A4;margin:12mm 13mm}
    @media print{
      html,body{background:#fff}
      .bar{display:none}
      .page{margin:0;box-shadow:none;width:auto;min-height:0;padding:0;page-break-after:always}
      .page:last-child{page-break-after:auto}
      .page.cert{padding:0}
      .frame{min-height:271mm}
      .frame-in{min-height:269mm}
    }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden><button type="button" class="p" id="btnPrint">🖨 인쇄 / PDF 저장</button><button type="button" class="s" id="btnClose">닫기</button><span>인쇄 창에서 ‘PDF로 저장’을 고르면 PDF 파일이 됩니다</span></div>
  <div id="doc"><div class="msg"><p>불러오는 중…</p></div></div>

  <script src="js/config.js?v=20260908lib"></script>
  <script src="js/catechism-data.js?v=20261025cr1"></script>
  <script src="js/edu-print.js?v=20261025cr2"></script>
</body>
</html>
