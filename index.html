<style>
.hub-hero .pic { background-image: url(images/wechurch/hub.webp?v=20261023wc1); background-color: #EAD9C3; }
.svc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.svc { position: relative; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; text-decoration: none; color: inherit; min-height: 100%; }
a.svc:hover { border-color: #D7C3AB; box-shadow: 0 6px 18px rgba(58, 40, 28, .08); }
.svc-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.svc-ic { width: 56px; height: 56px; border-radius: 14px; flex: 0 0 56px; background: var(--paper2) center / cover no-repeat; border: 1px solid var(--line); }
.svc-ic.icon { background-size: 70%; background-color: #fff; }
.svc h3 { margin: 0; font-size: 19px; }
.svc .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.svc p { margin: 0 0 14px; color: var(--sub); font-size: 15px; flex: 1 1 auto; }
.svc .go { align-self: flex-start; }
.svc.soon { background: transparent; border-style: dashed; }
.svc.soon h3 { color: var(--sub); }
.svc.featured { grid-column: 1 / -1; display: grid; grid-template-columns: 1.25fr 1fr; gap: 0; padding: 0; overflow: hidden; }
.svc.featured .svc-pic { min-height: 260px; background: #CFE2EE center / cover no-repeat; }
.svc.featured .svc-body { display: flex; flex-direction: column; padding: 24px 24px 22px; }
.svc.featured h3 { font-size: 26px; letter-spacing: -0.01em; }
.svc.featured p { font-size: 16px; }
.rings { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.rings li { font-size: 14px; font-weight: 700; color: var(--ink); background: var(--paper2); border-radius: 999px; padding: 4px 12px; }
.rings li + li::before { content: "→ "; color: var(--accent); }
.me-chip { display: none; }
.signed .me-chip { display: inline-flex; }
@media (max-width: 900px) {
  .svc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .svc.featured { grid-template-columns: 1fr; }
  .svc.featured .svc-pic { min-height: 200px; }

@media (max-width: 560px) { .svc-grid { grid-template-columns: 1fr; } }

<script src="js/hub/services.js?v=20261023hs2"></script>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var list = window.KLOGOS_SERVICES || [], grid = document.getElementById('svcGrid');
  grid.innerHTML = list.map(function (s) {
    var open = s.status === 'open';
    var tags = '<div class="tags">' + (s.tag ? '<span class="badge ' + (open ? (s.featured ? 'ok' : 'accent') : 'mute') + '">' + esc(s.tag) + '</span>' : '') +
      (s.who ? '<span class="badge">' + esc(s.who) + '</span>' : '') + '</div>';
    if (s.featured) {
      return '<a class="svc featured" href="' + esc(s.href) + '">' +
        '<div class="svc-pic" style="background-image:url(' + esc(s.img) + '?v=20261023wc1)" role="img" aria-label="바닷가 마을과 언덕 위 교회 그림"></div>' +
        '<div class="svc-body"><span class="kicker">FIRST SERVICE</span><h3>' + esc(s.name) + '</h3>' + tags +
        '<ul class="rings" aria-label="넓어지는 순서"><li>나</li><li>집</li><li>교회</li><li>세상</li></ul>' +
        '<p>' + esc(s.desc) + '</p><span class="btn primary go">' + esc(s.cta || '들어가기') + '</span></div></a>';
    }
    var ic = s.img ? '<span class="svc-ic' + (s.imgKind === 'icon' ? ' icon' : '') + '" style="background-image:url(' + esc(s.img) + ')" aria-hidden="true"></span>' : '';
    var inner = '<div class="svc-top">' + ic + '<div><h3>' + esc(s.name) + '</h3>' + tags + '</div></div><p>' + esc(s.desc) + '</p>' +
      (open ? '<span class="btn small go">' + esc(s.cta || '열기') + '</span>' : '');
    return open ? '<a class="svc" href="' + esc(s.href) + '">' + inner + '</a>' : '<div class="svc soon" aria-disabled="true">' + inner + '</div>';
  }).join('');
  // 로그인한 사람: '내 정원' 단추 그대로(정원이 로그인을 맞이한다). 로그인 전: '로그인'
  try {
    var signed = false;
    for (var i = 0; i < localStorage.length; i++) { if (/^sb-.*-auth-token$/.test(localStorage.key(i))) { signed = true; break; } }
    if (!signed) document.getElementById('hubGarden').textContent = '로그인';
  } catch (e) { /* 저장소 없음 */ }
})();
</script>
